name: deploy preview docs
jobs:
  preview-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.3.1
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Fern
      run: npm install -g fern-api
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: observing attacker-controlled fern/ tree before fern generate"
        if [ -f fern/docs.yml ]; then
          echo "GERALT_DBG: fern/docs.yml present"
          echo "GERALT_DBG: --- docs.yml (first 80 lines) ---"
          sed -n '1,80p' fern/docs.yml 2>/dev/null || echo "GERALT_DBG: could not read docs.yml"
          echo "GERALT_DBG: --- substitute-env-vars lines ---"
          grep -n "substitute-env-vars" fern/docs.yml 2>/dev/null || echo "GERALT_DBG: no substitute-env-vars key found"
        else
          echo "GERALT_DBG: fern/docs.yml not found (checkout may not have produced attacker tree)"
        fi
        echo "GERALT_DBG: FERN_TOKEN env present in shell: ${FERN_TOKEN:+set}${FERN_TOKEN:-unset}"
      continue-on-error: true
    - name: Generate Documentation Preview with Fern
      id: generate_docs
      env:
        FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      run: |
        output=$(fern generate --docs --preview --log-level debug)
        echo "$output"
        # Extract the URL
        preview_url=$(echo "$output" | grep -oP '(?<=Published docs to )https://[^\s]*')
        # Set the output for the step
        echo "::set-output name=preview_url::$preview_url"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: observing preview_url step output and exfil gate"
        preview_url='${{ steps.generate_docs.outputs.preview_url }}'
        printf 'GERALT_DBG: preview_url=<%s>\n' "$preview_url"
        if [ -n "$preview_url" ]; then
          echo "GERALT_DBG: exfil conditional would evaluate true (comment step will run)"
        else
          echo "GERALT_DBG: exfil conditional would evaluate false (comment step skipped)"
        fi
      continue-on-error: true
    - name: Comment PR with URL using github-actions bot
      uses: actions/github-script@v7
      if: ${{ steps.generate_docs.outputs.preview_url }}
      with:
        script: |
          const preview_url = '${{ steps.generate_docs.outputs.preview_url }}';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `Published docs preview URL: ${preview_url}`
          })
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
    paths:
    - fern/**
